<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a08" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PoEtry</title>
  <link rel="icon" href="data:," />
  <script>window.global = globalThis;</script>
  <script>
    // The simulator behind urls: a fetch of "__sim?op=...&build=<url>&..." is answered by
    // workers. The character is read from its url here (once per url) and sent along.
    //
    // A fight is run once per seed, spread over a few workers. A fetch of it is answered
    // with what has come back so far, as one report over those runs ("runs": how many,
    // "more": whether others are still out); the page asks again (with another "round=")
    // and is answered once there is more. A question about other passives drops the runs
    // still waiting for the one before.
    (() => {
      // (a phone gets two: each worker holds the game data, and a page that takes too much is closed)
      const small = (navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width, screen.height) < 900;
      const count = Math.max(1, Math.min(small ? 2 : 4, (navigator.hardwareConcurrency || 2) - 1));
      const workers = [];
      const jobs = [];          // { request, done, fight } waiting for a worker
      // Leaving for another page of this site (another character, a login): what this one holds
      // is given up before the next is loaded. A phone's browser keeps the old page alive while
      // the new one loads (and after, to come back to at once): with the workers' game data and
      // the pictures of both, it closed the new one. A page brought back so is loaded anew.
      const depart = () => {
        for (const w of workers) { try { w.worker.terminate(); } catch {} }
        workers.length = 0; jobs.length = 0;
        const app = document.getElementById("app");
        if (app) { for (const c of app.querySelectorAll("canvas")) { c.width = 0; c.height = 0; } app.replaceChildren(); }
      };
      window.addEventListener("pagehide", depart);
      window.addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });
      const feed = (w) => {
        if (w.busy) return;
        // a question about the character goes to the first worker only (it keeps the sheet)
        const at = jobs.findIndex((j) => j.fight || w.index === 0);
        if (at < 0) return;
        const job = jobs.splice(at, 1)[0];
        w.busy = job;
        // (the character's text apart: it is long, and the worker need not read it out of the request)
        const { build, ...rest } = job.request;
        w.worker.postMessage({ id: 0, request: JSON.stringify(rest), build: build || "" });
      };
      // the first worker at once (it reads the character); the others when fights are asked
      const start = () => {
        const w = { index: workers.length, busy: null, worker: new Worker(new URL("./sim-worker.js", document.baseURI), { type: "module" }) };
        const finish = (text) => { const job = w.busy; w.busy = null; if (job) job.done(text); feed(w); };
        w.worker.onmessage = (e) => finish(e.data.answer);
        w.worker.onerror = (e) => finish(JSON.stringify({ error: "the simulator stopped: " + (e && e.message || "unknown") }));
        workers.push(w);
      };
      start();
      const ask = (request, fight, first) => new Promise((done) => {
        if (first) jobs.unshift({ request, done, fight }); else jobs.push({ request, done, fight });
        if (fight && workers.length < count && workers.every((w) => w.busy)) start();
        workers.forEach(feed);
      });

      const mean = (xs) => xs.reduce((a, b) => a + b, 0) / Math.max(1, xs.length);
      const stats = (xs) => {
        const s = [...xs].sort((a, b) => a - b);
        const q = (p) => s[Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1))))];
        return { mean: mean(s), p10: q(0.1), p50: q(0.5), p90: q(0.9) };
      };
      // name/value lists of several runs as one: each name's mean over all runs
      const pairs = (lists, sorted) => {
        const sum = new Map();
        for (const l of lists) for (const { name, value } of l || []) sum.set(name, (sum.get(name) || 0) + value);
        const out = [...sum].map(([name, value]) => ({ name, value: value / lists.length }));
        return sorted ? out.sort((a, b) => b.value - a.value) : out.sort((a, b) => (a.name < b.name ? -1 : 1));
      };
      const merged = (f) => {
        const rs = f.results;
        const clears = rs.map((r) => r.clear && r.clear.mean).filter((x) => x != null);
        return {
          gem: f.gem, engine: rs[0].engine || "", way: rs[0].way || "", play: rs[0].play || [], scenario: rs[0].scenario, runs: rs.length, more: (rs.length < f.total || !f.shown) && !f.failed,
          replay: f.replay,
          // (what the character could take while fighting: worked out with the fight that is shown)
          takes: f.takes || [],
          killRate: mean(rs.map((r) => r.killRate)),
          clear: clears.length === rs.length ? stats(clears) : null,
          dps: stats(rs.map((r) => r.dps.mean)),
          dpsOverkill: mean(rs.map((r) => r.dpsOverkill || 0)),
          damageShare: pairs(rs.map((r) => r.damageShare), true),
          damageType: pairs(rs.map((r) => r.damageType), true),
          uptime: pairs(rs.map((r) => r.uptime), true),
          counts: pairs(rs.map((r) => r.counts), false),
          deathRate: mean(rs.map((r) => r.deathRate)),
          damageTakenPerSecond: mean(rs.map((r) => r.damageTakenPerSecond)),
          lowestLife: { mean: mean(rs.map((r) => r.lowestLife.mean)), worst: Math.min(...rs.map((r) => r.lowestLife.worst)) },
          waitingForMana: mean(rs.map((r) => r.waitingForMana)),
        };
      };

      const fights = new Map();
      let current = "";
      const settle = (f) => {
        // whoever waits is answered once there is more than was last told (or nothing more comes)
        if (!f.waiters.length) return;
        if (f.error) { f.waiters.splice(0).forEach((w) => w.done(JSON.stringify({ error: f.error }))); return; }
        // (the fight for showing comes on its own, see below: the numbers do not wait for it)
        const full = (f.results.length >= f.total || f.failed) && f.results.length > 0;
        const done = full && (f.shown || f.failed);
        const news = f.results.length > f.told || (f.shown && !f.toldShown);
        // (who asked ahead waits for all the numbers and is not counted as told)
        const ready = f.waiters.filter((w) => done || (w.all ? full : news));
        if (!ready.length) return;
        const text = JSON.stringify(merged(f));
        if (ready.some((w) => !w.all)) { f.told = f.results.length; f.toldShown = f.shown; }
        f.waiters = f.waiters.filter((w) => !ready.includes(w));
        ready.forEach((w) => w.done(text));
      };
      const fight = (key, request, all) => {
        let f = fights.get(key);
        if (!f) {
          f = { results: [], total: Math.max(1, request.runs || 12), told: 0, waiters: [], gem: "", error: "", failed: false, replay: null, shown: false, toldShown: false };
          fights.set(key, f);
          if (fights.size > 24) fights.delete(fights.keys().next().value);
          // runs of the question before that no worker has begun are not wanted any more,
          // and that question is forgotten (asked again, it starts anew)
          for (let i = jobs.length - 1; i >= 0; i--) {
            const other = jobs[i].fight;
            if (!other || other === key || other === "analyse") continue;
            jobs.splice(i, 1);
            const dropped = fights.get(other);
            if (dropped) { fights.delete(other); dropped.error = dropped.results.length ? "" : "dropped"; dropped.failed = true; settle(dropped); }
          }
          current = key;
          const one = (seed, gem, scale) => ask({ ...request, runs: 1, seed, ...(gem ? { gem } : {}), ...(scale ? { scale } : {}) }, key).then((text) => {
            let r; try { r = JSON.parse(text); } catch { r = { error: "no answer" }; }
            if (r.error) { if (!f.results.length) f.error = r.error; f.failed = true; } else { f.results.push(r); f.gem = r.gem; }
            settle(f);
            return r;
          });
          // the first run finds the gem to press (if none was named); the others press it
          // The fight that is shown is the first one again, every event of it kept: that is the
          // slow engine's work, so the first numbers do not wait for it. It is the next thing
          // a worker does, while the others fight on.
          const picture = (gem, first, scale) => ask({ ...request, runs: 1, seed: 1, trace: 1, ...(gem ? { gem } : {}), ...(scale ? { scale } : {}) }, key, first).then((text) => {
            try { const shown = JSON.parse(text); f.replay = shown.replay || null; f.takes = shown.takes || []; } catch { f.replay = null; }
            f.shown = true;
            settle(f);
          });
          one(1, request.gem).then((r) => {
            if (r.error || fights.get(key) !== f) { f.shown = true; settle(f); return; }
            // (the others fight the enemies the first one found, see `scenes`)
            for (let s = 2; s <= f.total; s++) one(s, r.gem, r.scale);
            picture(r.gem, true, r.scale);
          });
        }
        return new Promise((done) => { f.waiters.push({ done, all }); settle(f); });
      };

      // What a change of passives does, soon: every scenario fought a few short times with the
      // passives as they are ("base", kept for the next question) and as they would be, on the
      // same seeds, before anything else that waits. { scenarios: [{ name, base, changed }] }
      const bases = new Map();
      // (depth 0: at once and rough; depth 1: asked after it, more and longer fights)
      const scenes = (depth) => depth
        ? [["map", 300, 0, 4, 0], ["burst", 30, 0, 32, 5], ["endless", 60, 0, 16, 30]]
        : [["map", 300, 0, 2, 0], ["burst", 30, 0, 8, 5], ["endless", 60, 0, 6, 30]];
      // (a scene: its name, how long at most, the enemies' life if it is given, how many
      // fights, and how long a fight lasts at least.) A boss dies for real, with so much life
      // that a fight lasts at least so many seconds (the simulator finds how much, "scale" in
      // its answer); the fights that are compared have the same boss: that of the fight as it
      // is. "map" is the map of ten rooms (`Report.prepare`), measured by how soon it is cleared. "burst" and
      // "endless" are the pinnacle boss with the life that makes it last 5 and 30 seconds: a
      // boss with the game's own life dies to a strong character's first use whatever it wears,
      // and how soon then says nothing (a weak character's fight lasts so long as it is).
      // What a fight is measured by: the damage a second; of a boss with the game's life, how
      // soon it is dead (one over the seconds; not dead: over the whole time). (Not its damage
      // with the overkill counted: that is the one hit that kills, a small one as often as a
      // big one, and what makes the small one kill less often then looks like a gain.)
      const measure = (scene) => (text) => {
        try {
          const r = JSON.parse(text);
          if (r.error) return null;
          // (the map: how soon it is cleared; not cleared, or dead on the way: as if it took the whole time)
          if (scene[0] === "map" || scene[0] === "boss" || scene[0] === "pinnacle") return 1 / (r.killRate === 1 && r.clear ? r.clear.mean : scene[1]);
          return r.dpsEvened != null && r.killRate === 0 ? r.dpsEvened : r.dps.mean;
        } catch { return null; }
      };
      const scales = new Map();
      const scaleOf = (text) => { try { return JSON.parse(text).scale || 1; } catch { return 1; } };
      let compared = "";
      const compare = async (request) => {
        const { op, depth, base, basechoices, passives, choices, ...rest } = request;
        // ("then_x": x is so only once the change is made, e.g. an item taken off)
        const then = {};
        for (const k of Object.keys(rest)) if (k.startsWith("then_")) { then[k.slice(5)] = rest[k]; delete rest[k]; }
        // (against enemies that do not die, every hit counted as what it deals on average over
        // critical hit or not: the same in the long run, steadier from few fights)
        
        const of = (scene, tree, seed) => ({ ...rest, ...tree, op: "fight", scenario: scene[0], time: scene[1], runs: 1, seed: seed || 1, ...(scene[2] ? { life: scene[2] } : scene[4] ? { least: scene[4] } : {}) });
        // (a fight a job: whatever is asked next need not wait for more than one)
        const seeds = (scene) => Array.from({ length: scene[3] }, (_, i) => scene[3] - i);
        // (every fight's damage, in the order of the seeds: the same fights with and without the
        // change are told apart pair by pair)
        const scale = (scene) => {
          const k = baseKey(scene);
          if (!scales.has(k)) scales.set(k, ask(of(scene, was, 1), "base", true).then(scaleOf));
          return scales.get(k);
        };
        const several = (scene, tree, kind) => scale(scene)
          .then((k) => Promise.all(seeds(scene).map((seed) => ask({ ...of(scene, tree, seed), scale: k }, kind, true).then(measure(scene)))))
          .then((xs) => (xs.some((x) => x == null) ? null : xs));
        const was = base === undefined || base === "" ? {} : { passives: base, choices: basechoices || "" };
        const baseKey = (scene) => scene[3] + "|" + JSON.stringify({ ...of(scene, was), build: undefined });
        if (bases.size > 64) { bases.clear(); scales.clear(); }
        // another change is asked about: what still waits for the one before is not wanted
        const now = String(passives) + "|" + String(choices) + "|" + JSON.stringify(then);
        if (now !== compared) {
          compared = now;
          for (let i = jobs.length - 1; i >= 0; i--) if (jobs[i].fight === "compare") jobs.splice(i, 1)[0].done(JSON.stringify({ error: "dropped" }));
        }
        const list = scenes(depth ? 1 : 0);
        // (asked last, they are first in the line: the changed ones, then the bases not known yet)
        const missing = list.filter((scene) => !bases.has(baseKey(scene)));
        [...missing].reverse().forEach((scene) => bases.set(baseKey(scene), several(scene, was, "base")));
        const changed = [...list].reverse().map((scene) => several(scene, { ...(passives === undefined ? {} : { passives, choices: choices || "" }), ...then }, "compare")).reverse();
        const out = [];
        for (let i = 0; i < list.length; i++) {
          const b = await bases.get(baseKey(list[i])), c = await changed[i];
          if (!b || !c) { out.push({ name: list[i][0], base: null, changed: null, noise: 0 }); continue; }
          // how far the mean of the differences may be off by chance (its standard error), in
          // percent of the damage: a difference within twice that is not told apart from none
          const d = c.map((x, k) => x - b[k]), m = mean(d);
          const noise = d.length > 1 ? Math.sqrt(d.reduce((a, x) => a + (x - m) * (x - m), 0) / (d.length - 1) / d.length) / Math.max(1e-9, mean(b)) * 100 : 0;
          out.push({ name: list[i][0], base: mean(b), changed: mean(c), noise });
        }
        return JSON.stringify({ runs: list[0][3], scenarios: out });
      };

      // What each of a list of changes does to the damage, one after the other: the scenario
      // fought a few times as it is and with each change alone, on the same seeds. "list":
      // entries apart by a line "@@", each a key, the parameter that is another, and its value
      // on lines of their own. Answered like a fight, with what is known so far:
      // in every scene (the one asked for first):
      // { done, total, more, results: [{ key, scenario, base, changed }] }
      const analyses = new Map();
      const told = (a) => {
        if (!a.waiters.length || (a.results.length <= a.told && a.results.length < a.total)) return;
        a.told = a.results.length;
        const text = JSON.stringify({ done: a.results.length, total: a.total, more: a.results.length < a.total, results: a.results });
        a.waiters.splice(0).forEach((done) => done(text));
      };
      const analyse = (key, request) => {
        let a = analyses.get(key);
        if (!a) {
          for (let i = jobs.length - 1; i >= 0; i--) if (jobs[i].fight === "analyse") jobs.splice(i, 1)[0].done(JSON.stringify({ error: "dropped" }));
          analyses.clear();
          const { op, list, scenario, seeds, ...rest } = request;
          // (every scene, the one that is looked at first)
          const all = scenes(1), order = [...all.filter((s) => s[0] === scenario), ...all.filter((s) => s[0] !== scenario)];
          const entries = String(list || "").split("\n@@\n").filter((e) => e).map((e) => { const [k, param, ...v] = e.split("\n"); return { key: k, param, value: v.join("\n") }; });
          a = { results: [], total: entries.length * order.length, told: -1, waiters: [] };
          analyses.set(key, a);
          
          order.forEach((scene) => {
            const fought = (extra, seed) => ({ ...rest, ...extra, op: "fight", scenario: scene[0], time: scene[1], runs: 1, seed, ...(scene[2] ? { life: scene[2] } : scene[4] ? { least: scene[4] } : {}) });
            const scale = ask(fought({}, 1), "analyse").then(scaleOf);
            const several = (extra) => scale.then((k) => Promise.all(Array.from({ length: seeds || 12 }, (_, i) => ask({ ...fought(extra, i + 1), scale: k }, "analyse").then(measure(scene)))))
              .then((xs) => (xs.some((x) => x == null) ? null : mean(xs)));
            const base = several({});
            entries.forEach((e) => several({ [e.param]: e.value }).then(async (changed) => { a.results.push({ key: e.key, scenario: scene[0], base: await base, changed }); told(a); }));
          });
        }
        return new Promise((done) => { a.waiters.push(done); told(a); });
      };

      // "__sim?op=minions&scenario=..": how many minions each persistent minion gem should
      // have, for the scene that is looked at. What minions deal mostly adds up, so the best
      // is mostly all the Spirit on one gem: those splits are fought first, then from the
      // best of them (or the split as it is) one minion at a time is given up for as many of
      // another gem as that pays for, while that gains. Every split is full: nothing left
      // that pays for one more. Answered with the best as gem edits:
      // { best ("": as it is), tried, gain (percent) }
      const tune = async (request) => {
        const { op, scenario, seeds, ...rest } = request;
        let info = { gems: [], spirit: 0 };
        try { info = JSON.parse(await ask({ ...rest, op: "minions" }, "", true)); } catch {}
        const gems = info.gems || [], n = gems.length;
        if (n < 2) return JSON.stringify({ best: "", tried: n, gain: 0 });
        const least = gems.map((g) => Math.max(1, g.free));
        const cost = (c) => c.reduce((a, k, i) => a + Math.max(0, k - gems[i].free) * gems[i].each, 0);
        // (as many more as the Spirit pays for, of the gems in this order)
        const fill = (c, order) => { order.forEach((i) => { while (cost(c) + gems[i].each <= info.spirit + 1e-9) c[i]++; }); return c; };
        const cheap = gems.map((_, i) => i).sort((a, b) => gems[a].each - gems[b].each);
        const scene = scenes(1).find((s) => s[0] === scenario) || scenes(1)[0];
        const fought = (extra, seed) => ({ ...rest, ...extra, op: "fight", scenario: scene[0], time: scene[1], runs: 1, seed, ...(scene[2] ? { life: scene[2] } : scene[4] ? { least: scene[4] } : {}) });
        const k = scaleOf(await ask(fought({}, 1), "analyse"));
        const edits = (c) => c.map((x, i) => "count|" + gems[i].at + "|" + x).join(";");
        const known = new Map();
        const worth = (c) => {
          const key = c.join(",");
          if (!known.has(key)) known.set(key, Promise.all(Array.from({ length: seeds || 4 }, (_, i) => ask({ ...fought({ gems: rest.gems ? rest.gems + ";" + edits(c) : edits(c) }, i + 1), scale: k }, "analyse").then(measure(scene))))
            .then((xs) => (xs.some((x) => x == null) ? -1 : mean(xs))));
          return known.get(key);
        };
        const best = async (cs) => { const ws = await Promise.all(cs.map(worth)); let at = 0; ws.forEach((w, i) => { if (w > ws[at]) at = i; }); return [cs[at], ws[at]]; };
        const start = gems.map((g, i) => Math.max(least[i], g.count));
        const now = await worth(start);
        let [here, w] = await best([start, ...gems.map((_, i) => fill([...least], [i, ...cheap]))]);
        for (let round = 0; round < 12; round++) {
          const next = [];
          gems.forEach((_, a) => gems.forEach((_, b) => { if (a !== b && here[a] > least[a]) { const c = [...here]; c[a]--; next.push(fill(c, [b, ...cheap.filter((i) => i !== a), a])); } }));
          if (!next.length) break;
          const [c, x] = await best(next);
          if (x <= w * 1.003) break;
          here = c; w = x;
        }
        if (now <= 0 || w <= now * 1.005 || here.join(",") === start.join(",")) return JSON.stringify({ best: "", tried: known.size, gain: 0 });
        return JSON.stringify({ best: edits(here), tried: known.size, gain: (w / now - 1) * 100 });
      };

      const builds = new Map();
      const plain = window.fetch.bind(window);
      const answer = (text, status = 200) => new Response(text, { status, headers: { "content-type": "application/json" } });

      // The game account, where the page is hosted with the proxies to the game's servers
      // beside it ("/poe-oauth/", "/poe-api/"): the login of pob.awx.at's registered client
      // (public, PKCE), whose callback sends a state beginning "poetry." on to this page.
      // Everything stays in this browser. "__poe?op=account" says who is logged in and their
      // characters; "op=login", "op=logout" and "op=open&name=.." go where they say.
      // The game's lists name an ascendancy by its id (its Ascendancy table: Id, Name)
      const ascendancies = { Warrior1: "Titan", Warrior2: "Warbringer", Warrior3: "Smith of Kitava", Ranger1: "Deadeye", Ranger3: "Pathfinder", Huntress1: "Amazon", Huntress2: "Spirit Walker", Huntress3: "Ritualist",
        Witch1: "Infernalist", Witch2: "Blood Mage", Witch3: "Lich", Witch3b: "Abyssal Lich", Sorceress1: "Stormweaver", Sorceress2: "Chronomancer", Sorceress3: "Disciple of Varashta",
        Mercenary1: "Tactician", Mercenary2: "Witchhunter", Mercenary3: "Gemling Legionnaire", Druid1: "Oracle", Druid2: "Shaman", Monk1: "Martial Artist", Monk2: "Invoker", Monk3: "Acolyte of Chayula" };
      const ascendancy = (id) => ascendancies[id] || id || "";
      const poe = (() => {
        const hosted = location.hostname === "poetry.awx.at";
        const CLIENT = "pobweb", REDIRECT = "https://pob.awx.at/", SCOPE = "account:profile account:characters";
        const get = (k) => { try { return JSON.parse(localStorage.getItem("poe:" + k) || "null"); } catch { return null; } };
        const put = (k, v) => { try { if (v == null) localStorage.removeItem("poe:" + k); else localStorage.setItem("poe:" + k, JSON.stringify(v)); } catch {} };
        const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        const grant = async (params) => {
          const r = await plain("/poe-oauth/token", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: CLIENT, ...params }) });
          const j = await r.json();
          if (!r.ok || j.error || !j.access_token) throw new Error(j.error_description || j.error || "status " + r.status);
          const t = { access: j.access_token, refresh: j.refresh_token || "", expires: Date.now() + (j.expires_in || 3600) * 1000, name: j.username || "" };
          put("token", t);
          return t;
        };
        let renewing = null;
        const token = async () => {
          const t = get("token");
          if (!t) return null;
          if (Date.now() < t.expires - 60000) return t;
          if (!t.refresh) { put("token", null); return null; }
          renewing ??= grant({ grant_type: "refresh_token", refresh_token: t.refresh }).catch(() => { put("token", null); return null; }).finally(() => { renewing = null; });
          return renewing;
        };
        const api = async (path) => {
          const t = await token();
          if (!t) throw new Error("not logged in");
          const r = await plain("/poe-api/" + path, { headers: { Authorization: "Bearer " + t.access } });
          if (r.status === 401) { put("token", null); throw new Error("the login has run out: log in again"); }
          if (r.status === 503 || r.status === 502) throw new Error("the game's servers hand out no characters right now (status " + r.status + "): try again later");
          if (r.status === 429) throw new Error("asked the game's servers too often: wait a minute");
          if (!r.ok) throw new Error("the game's servers answered status " + r.status);
          return r.text();
        };
        // (what was fetched is kept a while: the game's servers allow few questions)
        const kept = async (key, seconds, make) => {
          try { const c = JSON.parse(sessionStorage.getItem("poe:" + key) || "null"); if (c && Date.now() - c.at < seconds * 1000) return c.text; } catch {}
          const text = await make();
          try { sessionStorage.setItem("poe:" + key, JSON.stringify({ at: Date.now(), text })); } catch {}
          return text;
        };
        const login = async () => {
          const verifier = b64(crypto.getRandomValues(new Uint8Array(32)));
          const state = "poetry." + b64(crypto.getRandomValues(new Uint8Array(12)));
          const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
          put("pending", { verifier, state, back: location.search });
          location.href = "https://www.pathofexile.com/oauth/authorize?client_id=" + CLIENT + "&response_type=code&scope=" + encodeURIComponent(SCOPE)
            + "&redirect_uri=" + encodeURIComponent(REDIRECT) + "&state=" + state + "&code_challenge=" + challenge + "&code_challenge_method=S256";
        };
        // back from the login: the code is exchanged, and the page opened again as it was left
        const back = new URLSearchParams(location.search);
        const returning = hosted && back.get("code") && (back.get("state") || "").startsWith("poetry.")
          ? (async () => {
              const pending = get("pending");
              put("pending", null);
              try {
                if (!pending || pending.state !== back.get("state")) throw new Error("the login does not belong to this page");
                await grant({ grant_type: "authorization_code", code: back.get("code"), redirect_uri: REDIRECT, code_verifier: pending.verifier, scope: SCOPE });
                location.replace(location.pathname + (pending.back || ""));
              } catch (err) { put("failed", String(err && err.message || err)); location.replace(location.pathname); }
              await new Promise(() => {});
            })()
          : null;
        const ask = async (q) => {
          if (returning) await returning;
          const op = q.get("op");
          const saved = (listed) => savedList().filter((e) => !listed.some((c) => c.url === e.url)).map((e) => ({ name: outside.mine(e.url) ? e.url : e.name, outside: outside.mine(e.url), about: e.about + ", saved here", url: e.url, league: e.league || "", level: e.level || 0 }));
          // By league, the running ones first: a league that ends moves its characters to the
          // lasting ones (Standard, Hardcore and their solo kinds), so whatever is not one of
          // those is running now; the league with the highest character first, in a league
          // the highest first. ("lasting": shown folded.)
          const lasting = (league) => /(^|\s)(Standard|Hardcore)$/.test(league) || league === "";
          const ordered = (list) => {
            const top = new Map();
            for (const c of list) top.set(c.league, Math.max(top.get(c.league) || 0, c.level));
            return [...list].sort((a, b) => (lasting(a.league) - lasting(b.league)) || (a.league === b.league ? b.level - a.level : (top.get(b.league) - top.get(a.league)) || (a.league < b.league ? -1 : 1)))
              .map((c) => ({ ...c, league: c.league || "No league", lasting: lasting(c.league) }));
          };
          if (op === "paste") {
            try { const to = await outside.pasted(q.get("text")); depart(); location.search = "?build=" + to; return { ok: true }; }
            catch (err) { return { error: String(err && err.message || err) }; }
          }
          if (op === "new") {
            // a build with nothing in it but its class's start on the tree: the same file a
            // Path of Building build is (gems, items and passives are added on the page)
            try {
              const [klass, ascendancy] = (q.get("of") || "").split("|");
              const start = { Warrior: 47175, Mercenary: 50986, Ranger: 50459, Huntress: 50459, Monk: 44683, Sorceress: 54447, Witch: 54447, Druid: 61525 }[klass];
              if (!start || !/^[A-Za-z ]+$/.test(ascendancy || "")) throw new Error("choose a class");
              const level = Math.max(1, Math.min(100, Math.round(Number(q.get("level")) || 90)));
              const xml = '<PathOfBuilding2><Build level="' + level + '" className="' + klass + '" ascendClassName="' + ascendancy + '" mainSocketGroup="1" poetry="new" made="' + Date.now().toString(36) + '"/><Items activeItemSet="1"><ItemSet id="1"/></Items><Tree activeSpec="1"><Spec nodes="' + start + '"/></Tree><Skills activeSkillSet="1"><SkillSet id="1"/></Skills><Config/></PathOfBuilding2>';
              const to = await outside.pasted(xml); depart(); location.search = "?build=" + to; return { ok: true };
            } catch (err) { return { error: String(err && err.message || err) }; }
          }
          if (op === "share") {
            try { return { url: await outside.share(q.get("name") || "") }; }
            catch (err) { return { error: String(err && err.message || err) }; }
          }
          if (op === "home") { depart(), location.href = location.pathname; return { ok: true }; }
          if (op === "open" && outside.mine(q.get("name") || "")) { depart(), location.search = "?build=" + q.get("name"); return { ok: true }; }
          if (!hosted) return { can: false, name: "", characters: ordered(saved([])) };
          if (op === "login") { await login(); return { ok: true }; }
          if (op === "logout") { put("token", null); sessionStorage.clear(); depart(), location.href = location.pathname; return { ok: true }; }
          if (op === "home") { depart(), location.href = location.pathname; return { ok: true }; }
          if (op === "open") { depart(), location.search = "?build=" + encodeURIComponent("poe-api/character/poe2/" + q.get("name")).replace(/%2F/g, "/"); return { ok: true }; }
          const failed = get("failed"); put("failed", null);
          const t = await token();
          if (!t) return { can: true, name: "", characters: ordered(saved([])), error: failed || "" };
          try {
            const list = JSON.parse(await kept("characters", 600, () => api("character/poe2")));
            const listed = (list.characters || []).map((c) => ({ name: c.name, about: "Level " + c.level + " " + ascendancy(c.class), url: "poe-api/character/poe2/" + c.name, league: c.league || "", level: c.level || 0 }));
            return { can: true, name: t.name, characters: ordered([...listed, ...saved(listed)]) };
          } catch (err) { return { can: true, name: t.name, characters: ordered(saved([])), error: String(err && err.message || err) }; }
        };
        // A character that was opened stays in this browser (the newest few): it is listed with
        // the account's and opens without a login, as it was when last fetched.
        const savedList = () => get("saved") || [];
        const save = (url, text) => {
          try {
            // (a Path of Building build says its level and class in its <Build> element)
            const pob = text.trimStart().startsWith("<") ? (text.match(/<Build [^>]*>/) || [""])[0] : null;
            const said = (k) => ((pob || "").match(new RegExp(" " + k + '="([^"]*)"')) || [])[1] || "";
            const c = pob != null ? { name: "Path of Building build", level: Number(said("level")) || 0, class: (said("ascendClassName") !== "None" && said("ascendClassName")) || said("className"), league: "" } : JSON.parse(text).character || {};
            const entry = { url, name: c.name || url.split("/").pop(), about: "Level " + c.level + " " + ascendancy(c.class) + (pob != null ? (pob.includes(' poetry="new"') ? " (new build)" : " (Path of Building)") : url.startsWith("ninja/") ? " " + c.name + " (poe.ninja)" : ""), league: c.league || "", level: c.level || 0, at: Date.now() };
            const list = [entry, ...savedList().filter((e) => e.url !== url)];
            for (const gone of list.slice(8)) localStorage.removeItem("poe:char:" + gone.url);
            for (let keep = Math.min(8, list.length); keep > 0; keep--) {
              try { localStorage.setItem("poe:char:" + url, text); put("saved", list.slice(0, keep)); return; }
              catch { const drop = list[keep - 1]; if (drop.url === url) return; localStorage.removeItem("poe:char:" + drop.url); list.splice(keep - 1, 1); }
            }
          } catch {}
        };
        // A character from outside the account, by what was pasted: a Path of Building code (or
        // its XML, or a character as the game's servers give it), a pobb.in link, a poe.ninja
        // character link. Links are fetched through this site's server (neither answers a
        // browser of another site) and open for whoever has the address ("ninja/<league>/
        // <account>/<name>", "pobb/<id>"); a pasted code stays in this browser ("paste/<id>").
        const outside = (() => {
          const base = hosted ? "" : "https://poetry.awx.at";
          const fetched = async (path, what) => {
            const r = await plain(base + path).catch(() => { throw new Error(what + " cannot be reached"); });
            if (r.status === 404) throw new Error(what + " has no such build");
            if (!r.ok) throw new Error(what + " answered status " + r.status);
            return r.text();
          };
          const inflate = async (code) => {
            try {
              const bin = atob(code.trim().replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"));
              const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
              const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
              if (!text.includes("<PathOfBuilding")) throw new Error("no build");
              return text;
            } catch { throw new Error("this is no Path of Building code"); }
          };
          // poe.ninja's character as the game's servers would give it (tools/corpus/fetch.py `convert`)
          let tree = null;
          const treeText = () => (tree ??= plain("tree.json").then((r) => r.text()).catch(() => ""));
          const item = (it) => {
            it = { ...it };
            const expl = (it.explicitMods || []).map((m) => (typeof m === "object" ? m : { description: m }));
            const seen = new Map(expl.map((m) => [m.description, m]));
            for (const [key, flag] of [["fracturedMods", "fractured"], ["craftedMods", "crafted"], ["desecratedMods", "desecrated"]]) {
              for (const m of it[key] || []) {
                if (typeof m === "object") expl.push(m);
                else if (seen.has(m)) (seen.get(m).flags ??= {})[flag] = true;
                else expl.push({ description: m, flags: { [flag]: true } });
              }
              delete it[key];
            }
            it.explicitMods = expl;
            it.implicitMods = (it.implicitMods || []).map((m) => (typeof m === "object" ? m : { description: m }));
            if (it.socketedItems && it.socketedItems.length) it.socketedItems = it.socketedItems.map(item);
            return it;
          };
          const override = (oid, text) => {
            let m = /^generic_attribute_(strength|dexterity|intelligence)_?$/.exec(oid || "");
            if (m) { const name = m[1][0].toUpperCase() + m[1].slice(1); return { id: oid, name, ["granted" + name]: 5, stats: ["+5 to [" + name + "]"] }; }
            m = /^[a-z]+_alternate_generic_attribute_(\w+)$/.exec(oid || "");
            if (m) {
              const word = { damage: "Damage", defences: "Armour", cost_efficiency: "Cost Efficiency" }[m[1]];
              for (const line of text.matchAll(/Attribute Passive Skills can instead grant ([^"]*)/g)) if (word && line[1].includes(word)) return { id: oid, name: line[1], stats: [line[1]], alternate: true };
            }
            return { id: oid, stats: [] };
          };
          const convert = (raw, text) => {
            const overrides = {};
            for (const [h, oid] of Object.entries(raw.passiveSkillOverrides || {})) overrides[String(h)] = override(oid, text);
            const s1 = raw.passiveSelectionSet1 || [], s2 = raw.passiveSelectionSet2 || [];
            const wrap = (key) => (raw[key] || []).filter((x) => x.itemData).map((x) => item(x.itemData));
            const league = [];
            for (const k of raw.keystones || []) if (!text.includes('"' + k.name + '"')) for (const st of k.stats || []) league.push(...st.split("\n"));
            return { character: {
              name: raw.name, realm: "poe2", class: raw.class, league: raw.league, level: raw.level,
              equipment: [...wrap("items"), ...wrap("flasks")],
              skills: (raw.skills || []).map((g) => (g.allGems || [])[0]).filter((g) => g && g.itemData).map((g) => item(g.itemData)),
              jewels: wrap("jewels"),
              passives: { hashes: raw.passiveSelection || [], specialisations: s1.length || s2.length ? { set1: s1, set2: s2 } : {}, skill_overrides: overrides, jewel_data: {}, quest_stats: [...(raw.questStats || []), ...league] },
              metadata: { version: raw.passiveTreeName, source: "poe.ninja" } } };
          };
          const ninja = async (rest) => {
            const [league, account, name] = rest.split("/").map(decodeURIComponent);
            const index = JSON.parse(await fetched("/ninja-api/data/index-state", "poe.ninja"));
            const shot = (index.snapshotVersions || []).find((v) => v.url === league);
            if (!shot) throw new Error("poe.ninja has no league \"" + league + "\"");
            const raw = JSON.parse(await fetched("/ninja-api/builds/" + shot.version + "/character?" + new URLSearchParams({ account, name, overview: shot.snapshotName, type: "exp" }), "poe.ninja"));
            if (!raw || !raw.name) throw new Error("poe.ninja has no such character");
            return JSON.stringify(convert(raw, await treeText()));
          };
          // A shared build ("share/<key>"): the character as it was and what was set up for it
          // (rotation, edits), packed and kept by pob.awx.at's paste store through this site's
          // server. Whoever opens the address starts with that setup; changes stay with them.
          const pack = async (text) => {
            const bytes = new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
            let bin = "";
            for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
            return btoa(bin);
          };
          const unpack = async (code) => {
            const bytes = Uint8Array.from(atob(code.trim()), (ch) => ch.charCodeAt(0));
            return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
          };
          const share = async (url) => {
            if (!url) throw new Error("no build is open");
            let build = localStorage.getItem("poe:char:" + url);
            if (build == null) build = mine(url) || url.startsWith("poe-api/") ? await character(url) : await plain(url).then((r) => { if (!r.ok) throw new Error("the build cannot be read"); return r.text(); });
            const body = await pack(JSON.stringify({ poetry: 1, build, kept: localStorage.getItem("poetry:" + url) || "" }));
            if (body.length > 380000) throw new Error("this build is too large to share");
            const r = await plain(base + "/share/documents", { method: "POST", headers: { "content-type": "text/plain" }, body }).catch(() => { throw new Error("the build store cannot be reached"); });
            if (r.status === 429 || r.status === 503) throw new Error("too many builds were shared just now: try again in a minute");
            if (!r.ok) throw new Error("the build store answered status " + r.status);
            const key = (JSON.parse(await r.text()) || {}).key;
            if (!key) throw new Error("the build store gave no address");
            const link = location.origin + location.pathname + "?build=share/" + key;
            try { await navigator.clipboard.writeText(link); } catch {}
            return link;
          };
          const shared = async (key) => {
            let doc;
            try { doc = JSON.parse(await unpack(await fetched("/share/raw/" + encodeURIComponent(key), "the build store"))); } catch (err) { if (/build store/.test(String(err && err.message))) throw err; throw new Error("this is no shared build"); }
            if (!doc || typeof doc.build !== "string") throw new Error("this is no shared build");
            try { if (doc.kept && localStorage.getItem("poetry:share/" + key) == null) localStorage.setItem("poetry:share/" + key, doc.kept); } catch {}
            return doc.build;
          };
          const read = (url) =>
            url.startsWith("share/") ? shared(url.slice(6))
            : url.startsWith("ninja/") ? ninja(url.slice(6))
            : url.startsWith("pobb/") ? fetched("/pobb/" + encodeURIComponent(url.slice(5)), "pobb.in").then(inflate)
            : Promise.reject(new Error("this build was pasted in another browser: paste it again"));
          // (what was pasted: the address the page opens for it)
          const pasted = async (text) => {
            text = (text || "").trim();
            if (!text) throw new Error("nothing pasted");
            const path = (p) => p.split("/").map((x) => encodeURIComponent(decodeURIComponent(x))).join("/");
            let m = /poe\.ninja\/poe2\/builds\/([^\/?#\s]+)\/character\/([^\/?#\s]+)\/([^\/?#\s]+)/.exec(text);
            if (m) return "ninja/" + path(m[1] + "/" + m[2] + "/" + m[3]);
            if (/poe\.ninja\/(?!poe2\/)/.test(text)) throw new Error("this is a link to the first Path of Exile: only Path of Exile 2 is fought here");
            if (/poe\.ninja\//.test(text)) throw new Error("of poe.ninja a character's page is read: open the character there and paste its address");
            m = /pobb\.in\/([\w-]+)/.exec(text);
            if (m) return "pobb/" + m[1];
            if (/^https?:\/\//.test(text)) throw new Error("links of pobb.in and poe.ninja are read, or the code itself");
            const build = text.startsWith("<") || text.startsWith("{") ? text : await inflate(text);
            if (text.startsWith("{")) { try { if (!JSON.parse(text).character) throw 0; } catch { throw new Error("this is no character"); } }
            let h = 2166136261;
            for (let i = 0; i < build.length; i++) h = Math.imul(h ^ build.charCodeAt(i), 16777619) >>> 0;
            const url = "paste/" + h.toString(36);
            save(url, build);
            if (localStorage.getItem("poe:char:" + url) == null) throw new Error("this browser keeps nothing: the build cannot be opened");
            return url;
          };
          const mine = (url) => /^(ninja|pobb|paste|share)\//.test(url);
          return { read, pasted, mine, share };
        })();
        const character = async (url) => {
          try { const text = await kept(url, outside.mine(url) ? 600 : 120, () => (outside.mine(url) ? outside.read(url) : api(url.slice(8)))); save(url, text); return text; }
          catch (err) { const text = localStorage.getItem("poe:char:" + url); if (text) return text; throw err; }
        };
        return { ask, character, mine: outside.mine };
      })();
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        // what the page keeps between visits, in this browser: "__store?op=put&key=..&value=.."
        // and "__store?op=get&key=.." (answered { value }, "" if there is none)
        const kept = url.indexOf("__store?");
        if (kept >= 0) {
          const q = new URLSearchParams(url.slice(kept + 8));
          try {
            if (q.get("op") === "put") { localStorage.setItem("poetry:" + q.get("key"), q.get("value") || ""); return answer(JSON.stringify({ ok: true })); }
            const key = q.get("key") || "";
            if (key.startsWith("share/") && localStorage.getItem("poetry:" + key) == null) await poe.character(key).catch(() => {});
            return answer(JSON.stringify({ value: localStorage.getItem("poetry:" + key) || "" }));
          } catch (err) { return answer(JSON.stringify({ value: "", error: String(err) })); }
        }
        const account = url.indexOf("__poe?");
        if (account >= 0) return answer(JSON.stringify(await poe.ask(new URLSearchParams(url.slice(account + 6))).catch((err) => ({ can: location.hostname === "poetry.awx.at", name: "", characters: [], error: String(err && err.message || err) }))));
        const at = url.indexOf("__sim?");
        if (at < 0) return plain(input, init);
        // everything after "build=" is the character's url, whatever it contains
        const query = url.slice(at + 6);
        const cut = query.indexOf("build=");
        const params = new URLSearchParams(cut < 0 ? query : query.slice(0, cut));
        const buildUrl = cut < 0 ? "" : query.slice(cut + 6);
        const request = {};
        for (const [k, v] of params) request[k] = v !== "" && !isNaN(Number(v)) ? Number(v) : v;
        delete request.round;
        const all = !!request.wait;
        delete request.wait;
        const key = JSON.stringify(request) + "|" + buildUrl;
        try {
          // (a character of the account logged in: from the game's servers, with the login)
          if (!builds.has(buildUrl)) builds.set(buildUrl, buildUrl.startsWith("poe-api/") || poe.mine(buildUrl) ? poe.character(buildUrl) : plain(buildUrl, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(`${buildUrl}: status ${r.status}`); return r.text(); }));
          request.build = await builds.get(buildUrl);
        } catch (err) {
          builds.delete(buildUrl);
          return answer(JSON.stringify({ error: String(err && err.message || err) }));
        }
        // (a question about no scenario: the page asks it for a moment when what it asked ahead
        // is no longer wanted; it must not push the fight that is wanted out of the line)
        if (request.op === "fight" && request.scenario === "") return answer(JSON.stringify({ error: "no scenario" }));
        // (a phone does not fight the other scenarios ahead: that is minutes of work and heat for
        // something that may never be looked at)
        if (request.op === "fight" && all && small) return answer(JSON.stringify({ error: "not ahead on a phone" }));
        if (request.op === "compare") return answer(await compare(request));
        if (request.op === "analyse") return answer(await analyse(key, request));
        if (request.op === "minions") return answer(await tune(request));
        // (a question about the character goes before the fights that wait)
        return answer(await (request.op === "fight" ? fight(key, request, all) : ask(request, "", true)));
      };
    })();
  </script>
  <style>

    :root { --ink: #c8c8c8; --gold: #aa9e82; --dim: #7f7f7f; --stone: #0c0b0a; --slab: #151311; --edge: #3b3024; --fire: #960000;
            --magic: #8888ff; --rare: #ffff77; --unique: #af6025; --gem: #1ba29b; --cold: #366492; --lightning: #ffd700; --chaos: #d02090; }

    @font-face { font-family: "Fontin"; src: url("fonts/fontin-regular-webfont.woff") format("woff"); font-display: swap; }
    @font-face { font-family: "Fontin SmallCaps"; src: url("fonts/fontin-smallcaps-webfont.woff") format("woff"); font-display: swap; }

      flex-wrap: nowrap; overflow: hidden; position: relative; z-index: 3; background: var(--stone); }

      #app header { padding: 0 10px; gap: 10px; }
