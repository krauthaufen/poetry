<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a08" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PoEtry</title>
  <link rel="icon" href="data:," />
  <script>window.global = globalThis;</script>
  <script>
    // The simulator behind urls: a fetch of "__sim?op=...&build=<url>&..." is answered by
    // workers. The character is read from its url here (once per url) and sent along.
    //
    // A fight is run once per seed, spread over a few workers. A fetch of it is answered
    // with what has come back so far, as one report over those runs ("runs": how many,
    // "more": whether others are still out); the page asks again (with another "round=")
    // and is answered once there is more. A question about other passives drops the runs
    // still waiting for the one before.
    (() => {
      // (a phone gets two: each worker holds the game data, and a page that takes too much is closed)
      const small = (navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width, screen.height) < 900;
      const count = Math.max(1, Math.min(small ? 2 : 4, (navigator.hardwareConcurrency || 2) - 1));
      const workers = [];
      const jobs = [];          // { request, done, fight } waiting for a worker
      const feed = (w) => {
        if (w.busy) return;
        // a question about the character goes to the first worker only (it keeps the sheet)
        const at = jobs.findIndex((j) => j.fight || w.index === 0);
        if (at < 0) return;
        const job = jobs.splice(at, 1)[0];
        w.busy = job;
        // (the character's text apart: it is long, and the worker need not read it out of the request)
        const { build, ...rest } = job.request;
        w.worker.postMessage({ id: 0, request: JSON.stringify(rest), build: build || "" });
      };
      // the first worker at once (it reads the character); the others when fights are asked
      const start = () => {
        const w = { index: workers.length, busy: null, worker: new Worker(new URL("./sim-worker.js", document.baseURI), { type: "module" }) };
        const finish = (text) => { const job = w.busy; w.busy = null; if (job) job.done(text); feed(w); };
        w.worker.onmessage = (e) => finish(e.data.answer);
        w.worker.onerror = (e) => finish(JSON.stringify({ error: "the simulator stopped: " + (e && e.message || "unknown") }));
        workers.push(w);
      };
      start();
      const ask = (request, fight, first) => new Promise((done) => {
        if (first) jobs.unshift({ request, done, fight }); else jobs.push({ request, done, fight });
        if (fight && workers.length < count && workers.every((w) => w.busy)) start();
        workers.forEach(feed);
      });

      const mean = (xs) => xs.reduce((a, b) => a + b, 0) / Math.max(1, xs.length);
      const stats = (xs) => {
        const s = [...xs].sort((a, b) => a - b);
        const q = (p) => s[Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1))))];
        return { mean: mean(s), p10: q(0.1), p50: q(0.5), p90: q(0.9) };
      };
      // name/value lists of several runs as one: each name's mean over all runs
      const pairs = (lists, sorted) => {
        const sum = new Map();
        for (const l of lists) for (const { name, value } of l || []) sum.set(name, (sum.get(name) || 0) + value);
        const out = [...sum].map(([name, value]) => ({ name, value: value / lists.length }));
        return sorted ? out.sort((a, b) => b.value - a.value) : out.sort((a, b) => (a.name < b.name ? -1 : 1));
      };
      const merged = (f) => {
        const rs = f.results;
        const clears = rs.map((r) => r.clear && r.clear.mean).filter((x) => x != null);
        return {
          gem: f.gem, play: rs[0].play || [], scenario: rs[0].scenario, runs: rs.length, more: rs.length < f.total && !f.failed,
          replay: (rs.find((r) => r.replay) || {}).replay || null,
          killRate: mean(rs.map((r) => r.killRate)),
          clear: clears.length === rs.length ? stats(clears) : null,
          dps: stats(rs.map((r) => r.dps.mean)),
          damageShare: pairs(rs.map((r) => r.damageShare), true),
          damageType: pairs(rs.map((r) => r.damageType), true),
          uptime: pairs(rs.map((r) => r.uptime), true),
          counts: pairs(rs.map((r) => r.counts), false),
          deathRate: mean(rs.map((r) => r.deathRate)),
          damageTakenPerSecond: mean(rs.map((r) => r.damageTakenPerSecond)),
          lowestLife: { mean: mean(rs.map((r) => r.lowestLife.mean)), worst: Math.min(...rs.map((r) => r.lowestLife.worst)) },
          waitingForMana: mean(rs.map((r) => r.waitingForMana)),
        };
      };

      const fights = new Map();
      let current = "";
      const settle = (f) => {
        // whoever waits is answered once there is more than was last told (or nothing more comes)
        if (!f.waiters.length) return;
        if (f.error) { f.waiters.splice(0).forEach((w) => w.done(JSON.stringify({ error: f.error }))); return; }
        const done = (f.results.length >= f.total || f.failed) && f.results.length > 0;
        // (who asked ahead waits for all of it and is not counted as told)
        const ready = f.waiters.filter((w) => done || (!w.all && f.results.length > f.told));
        if (!ready.length) return;
        const text = JSON.stringify(merged(f));
        if (ready.some((w) => !w.all)) f.told = f.results.length;
        f.waiters = f.waiters.filter((w) => !ready.includes(w));
        ready.forEach((w) => w.done(text));
      };
      const fight = (key, request, all) => {
        let f = fights.get(key);
        if (!f) {
          f = { results: [], total: Math.max(1, request.runs || 12), told: 0, waiters: [], gem: "", error: "", failed: false };
          fights.set(key, f);
          if (fights.size > 24) fights.delete(fights.keys().next().value);
          // runs of the question before that no worker has begun are not wanted any more,
          // and that question is forgotten (asked again, it starts anew)
          for (let i = jobs.length - 1; i >= 0; i--) {
            const other = jobs[i].fight;
            if (!other || other === key || other === "analyse") continue;
            jobs.splice(i, 1);
            const dropped = fights.get(other);
            if (dropped) { fights.delete(other); dropped.error = dropped.results.length ? "" : "dropped"; dropped.failed = true; settle(dropped); }
          }
          current = key;
          const one = (seed, gem) => ask({ ...request, runs: 1, seed, ...(seed === 1 ? { trace: 1 } : {}), ...(gem ? { gem } : {}) }, key).then((text) => {
            let r; try { r = JSON.parse(text); } catch { r = { error: "no answer" }; }
            if (r.error) { if (!f.results.length) f.error = r.error; f.failed = true; } else { f.results.push(r); f.gem = r.gem; }
            settle(f);
            return r;
          });
          // the first run finds the gem to press (if none was named); the others press it
          one(1, request.gem).then((r) => { if (!r.error && fights.get(key) === f) for (let s = 2; s <= f.total; s++) one(s, r.gem); });
        }
        return new Promise((done) => { f.waiters.push({ done, all }); settle(f); });
      };

      // What a change of passives does, soon: every scenario fought a few short times with the
      // passives as they are ("base", kept for the next question) and as they would be, on the
      // same seeds, before anything else that waits. { scenarios: [{ name, base, changed }] }
      const bases = new Map();
      // (depth 0: at once and rough; depth 1: asked after it, more and longer fights)
      const scenes = (depth) => depth
        ? [["boss", 20, 1e12, 10], ["pinnacle", 20, 1e12, 10], ["pack", 8, 0, 10], ["surrounded", 8, 0, 10]]
        : [["boss", 8, 1e12, 3], ["pinnacle", 8, 1e12, 3], ["pack", 4, 0, 3], ["surrounded", 4, 0, 3]];
      let compared = "";
      const compare = async (request) => {
        const { op, depth, base, basechoices, passives, choices, ...rest } = request;
        // ("then_x": x is so only once the change is made, e.g. an item taken off)
        const then = {};
        for (const k of Object.keys(rest)) if (k.startsWith("then_")) { then[k.slice(5)] = rest[k]; delete rest[k]; }
        const dps = (text) => { try { const r = JSON.parse(text); return r.error ? null : r.dps.mean; } catch { return null; } };
        const of = (scene, tree, seed) => ({ ...rest, ...tree, op: "fight", scenario: scene[0], time: scene[1], runs: 1, seed: seed || 1, ...(scene[2] ? { life: scene[2] } : {}) });
        // (a fight a job: whatever is asked next need not wait for more than one)
        const seeds = (scene) => Array.from({ length: scene[3] }, (_, i) => scene[3] - i);
        const several = (scene, tree, kind) => Promise.all(seeds(scene).map((seed) => ask(of(scene, tree, seed), kind, true).then(dps)))
          .then((xs) => (xs.some((x) => x == null) ? null : mean(xs)));
        const was = base === undefined || base === "" ? {} : { passives: base, choices: basechoices || "" };
        const baseKey = (scene) => scene[3] + "|" + JSON.stringify({ ...of(scene, was), build: undefined });
        if (bases.size > 64) bases.clear();
        // another change is asked about: what still waits for the one before is not wanted
        const now = String(passives) + "|" + String(choices) + "|" + JSON.stringify(then);
        if (now !== compared) {
          compared = now;
          for (let i = jobs.length - 1; i >= 0; i--) if (jobs[i].fight === "compare") jobs.splice(i, 1)[0].done(JSON.stringify({ error: "dropped" }));
        }
        const list = scenes(depth ? 1 : 0);
        // (asked last, they are first in the line: the changed ones, then the bases not known yet)
        const missing = list.filter((scene) => !bases.has(baseKey(scene)));
        [...missing].reverse().forEach((scene) => bases.set(baseKey(scene), several(scene, was, "base")));
        const changed = [...list].reverse().map((scene) => several(scene, { ...(passives === undefined ? {} : { passives, choices: choices || "" }), ...then }, "compare")).reverse();
        const out = [];
        for (let i = 0; i < list.length; i++) out.push({ name: list[i][0], base: await bases.get(baseKey(list[i])), changed: await changed[i] });
        return JSON.stringify({ runs: list[0][3], scenarios: out });
      };

      // What each of a list of changes does to the damage, one after the other: the scenario
      // fought a few times as it is and with each change alone, on the same seeds. "list":
      // entries apart by a line "@@", each a key, the parameter that is another, and its value
      // on lines of their own. Answered like a fight, with what is known so far:
      // { done, total, more, results: [{ key, base, changed }] }
      const analyses = new Map();
      const told = (a) => {
        if (!a.waiters.length || (a.results.length <= a.told && a.results.length < a.total)) return;
        a.told = a.results.length;
        const text = JSON.stringify({ done: a.results.length, total: a.total, more: a.results.length < a.total, results: a.results });
        a.waiters.splice(0).forEach((done) => done(text));
      };
      const analyse = (key, request) => {
        let a = analyses.get(key);
        if (!a) {
          for (let i = jobs.length - 1; i >= 0; i--) if (jobs[i].fight === "analyse") jobs.splice(i, 1)[0].done(JSON.stringify({ error: "dropped" }));
          analyses.clear();
          const { op, list, scenario, seeds, ...rest } = request;
          const scene = scenes(1).find((s) => s[0] === scenario) || scenes(1)[0];
          const entries = String(list || "").split("\n@@\n").filter((e) => e).map((e) => { const [k, param, ...v] = e.split("\n"); return { key: k, param, value: v.join("\n") }; });
          a = { results: [], total: entries.length, told: -1, waiters: [] };
          analyses.set(key, a);
          const dps = (text) => { try { const r = JSON.parse(text); return r.error ? null : r.dps.mean; } catch { return null; } };
          const several = (extra) => Promise.all(Array.from({ length: seeds || 5 }, (_, i) => ask({ ...rest, ...extra, op: "fight", scenario: scene[0], time: Math.min(scene[1], 14), runs: 1, seed: i + 1, ...(scene[2] ? { life: scene[2] } : {}) }, "analyse").then(dps)))
            .then((xs) => (xs.some((x) => x == null) ? null : mean(xs)));
          const base = several({});
          entries.forEach((e) => several({ [e.param]: e.value }).then(async (changed) => { a.results.push({ key: e.key, base: await base, changed }); told(a); }));
        }
        return new Promise((done) => { a.waiters.push(done); told(a); });
      };

      const builds = new Map();
      const plain = window.fetch.bind(window);
      const answer = (text, status = 200) => new Response(text, { status, headers: { "content-type": "application/json" } });

      // The game account, where the page is hosted with the proxies to the game's servers
      // beside it ("/poe-oauth/", "/poe-api/"): the login of pob.awx.at's registered client
      // (public, PKCE), whose callback sends a state beginning "poetry." on to this page.
      // Everything stays in this browser. "__poe?op=account" says who is logged in and their
      // characters; "op=login", "op=logout" and "op=open&name=.." go where they say.
      const poe = (() => {
        const hosted = location.hostname === "poetry.awx.at";
        const CLIENT = "pobweb", REDIRECT = "https://pob.awx.at/", SCOPE = "account:profile account:characters";
        const get = (k) => { try { return JSON.parse(localStorage.getItem("poe:" + k) || "null"); } catch { return null; } };
        const put = (k, v) => { try { if (v == null) localStorage.removeItem("poe:" + k); else localStorage.setItem("poe:" + k, JSON.stringify(v)); } catch {} };
        const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        const grant = async (params) => {
          const r = await plain("/poe-oauth/token", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: CLIENT, ...params }) });
          const j = await r.json();
          if (!r.ok || j.error || !j.access_token) throw new Error(j.error_description || j.error || "status " + r.status);
          const t = { access: j.access_token, refresh: j.refresh_token || "", expires: Date.now() + (j.expires_in || 3600) * 1000, name: j.username || "" };
          put("token", t);
          return t;
        };
        let renewing = null;
        const token = async () => {
          const t = get("token");
          if (!t) return null;
          if (Date.now() < t.expires - 60000) return t;
          if (!t.refresh) { put("token", null); return null; }
          renewing ??= grant({ grant_type: "refresh_token", refresh_token: t.refresh }).catch(() => { put("token", null); return null; }).finally(() => { renewing = null; });
          return renewing;
        };
        const api = async (path) => {
          const t = await token();
          if (!t) throw new Error("not logged in");
          const r = await plain("/poe-api/" + path, { headers: { Authorization: "Bearer " + t.access } });
          if (r.status === 401) { put("token", null); throw new Error("the login has run out: log in again"); }
          if (r.status === 503 || r.status === 502) throw new Error("the game's servers hand out no characters right now (status " + r.status + "): try again later");
          if (r.status === 429) throw new Error("asked the game's servers too often: wait a minute");
          if (!r.ok) throw new Error("the game's servers answered status " + r.status);
          return r.text();
        };
        // (what was fetched is kept a while: the game's servers allow few questions)
        const kept = async (key, seconds, make) => {
          try { const c = JSON.parse(sessionStorage.getItem("poe:" + key) || "null"); if (c && Date.now() - c.at < seconds * 1000) return c.text; } catch {}
          const text = await make();
          try { sessionStorage.setItem("poe:" + key, JSON.stringify({ at: Date.now(), text })); } catch {}
          return text;
        };
        const login = async () => {
          const verifier = b64(crypto.getRandomValues(new Uint8Array(32)));
          const state = "poetry." + b64(crypto.getRandomValues(new Uint8Array(12)));
          const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
          put("pending", { verifier, state, back: location.search });
          location.href = "https://www.pathofexile.com/oauth/authorize?client_id=" + CLIENT + "&response_type=code&scope=" + encodeURIComponent(SCOPE)
            + "&redirect_uri=" + encodeURIComponent(REDIRECT) + "&state=" + state + "&code_challenge=" + challenge + "&code_challenge_method=S256";
        };
        // back from the login: the code is exchanged, and the page opened again as it was left
        const back = new URLSearchParams(location.search);
        const returning = hosted && back.get("code") && (back.get("state") || "").startsWith("poetry.")
          ? (async () => {
              const pending = get("pending");
              put("pending", null);
              try {
                if (!pending || pending.state !== back.get("state")) throw new Error("the login does not belong to this page");
                await grant({ grant_type: "authorization_code", code: back.get("code"), redirect_uri: REDIRECT, code_verifier: pending.verifier, scope: SCOPE });
                location.replace(location.pathname + (pending.back || ""));
              } catch (err) { put("failed", String(err && err.message || err)); location.replace(location.pathname); }
              await new Promise(() => {});
            })()
          : null;
        const ask = async (q) => {
          if (returning) await returning;
          if (!hosted) return { can: false, name: "", characters: [] };
          const op = q.get("op");
          if (op === "login") { await login(); return { ok: true }; }
          if (op === "logout") { put("token", null); sessionStorage.clear(); location.reload(); return { ok: true }; }
          if (op === "open") { location.search = "?build=" + encodeURIComponent("poe-api/character/poe2/" + q.get("name")).replace(/%2F/g, "/"); return { ok: true }; }
          const failed = get("failed"); put("failed", null);
          const t = await token();
          if (!t) return { can: true, name: "", characters: [], error: failed || "" };
          try {
            const list = JSON.parse(await kept("characters", 600, () => api("character/poe2")));
            return { can: true, name: t.name, characters: (list.characters || []).map((c) => ({ name: c.name, about: "Level " + c.level + " " + c.class + (c.league ? " (" + c.league + ")" : ""), url: "poe-api/character/poe2/" + c.name })) };
          } catch (err) { return { can: true, name: t.name, characters: [], error: String(err && err.message || err) }; }
        };
        const character = (url) => kept(url, 120, () => api(url.slice(8)));
        return { ask, character };
      })();
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        // what the page keeps between visits, in this browser: "__store?op=put&key=..&value=.."
        // and "__store?op=get&key=.." (answered { value }, "" if there is none)
        const kept = url.indexOf("__store?");
        if (kept >= 0) {
          const q = new URLSearchParams(url.slice(kept + 8));
          try {
            if (q.get("op") === "put") { localStorage.setItem("poetry:" + q.get("key"), q.get("value") || ""); return answer(JSON.stringify({ ok: true })); }
            return answer(JSON.stringify({ value: localStorage.getItem("poetry:" + q.get("key")) || "" }));
          } catch (err) { return answer(JSON.stringify({ value: "", error: String(err) })); }
        }
        const account = url.indexOf("__poe?");
        if (account >= 0) return answer(JSON.stringify(await poe.ask(new URLSearchParams(url.slice(account + 6)))));
        const at = url.indexOf("__sim?");
        if (at < 0) return plain(input, init);
        // everything after "build=" is the character's url, whatever it contains
        const query = url.slice(at + 6);
        const cut = query.indexOf("build=");
        const params = new URLSearchParams(cut < 0 ? query : query.slice(0, cut));
        const buildUrl = cut < 0 ? "" : query.slice(cut + 6);
        const request = {};
        for (const [k, v] of params) request[k] = v !== "" && !isNaN(Number(v)) ? Number(v) : v;
        delete request.round;
        const all = !!request.wait;
        delete request.wait;
        const key = JSON.stringify(request) + "|" + buildUrl;
        try {
          // (a character of the account logged in: from the game's servers, with the login)
          if (!builds.has(buildUrl)) builds.set(buildUrl, buildUrl.startsWith("poe-api/") ? poe.character(buildUrl) : plain(buildUrl, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(`${buildUrl}: status ${r.status}`); return r.text(); }));
          request.build = await builds.get(buildUrl);
        } catch (err) {
          builds.delete(buildUrl);
          return answer(JSON.stringify({ error: String(err && err.message || err) }));
        }
        // (a question about no scenario: the page asks it for a moment when what it asked ahead
        // is no longer wanted; it must not push the fight that is wanted out of the line)
        if (request.op === "fight" && request.scenario === "") return answer(JSON.stringify({ error: "no scenario" }));
        if (request.op === "compare") return answer(await compare(request));
        if (request.op === "analyse") return answer(await analyse(key, request));
        // (a question about the character goes before the fights that wait)
        return answer(await (request.op === "fight" ? fight(key, request, all) : ask(request, "", true)));
      };
    })();
  </script>
  <style>
    /* (the framework brings Bootstrap along: everything here is under #app to win over it) */
    /* the game's own colours: text grey #7f7f7f, values white #c8c8c8 (normal items), magic blue #8888ff, rare yellow #ffff77,
       unique orange #af6025, gem teal #1ba29b, currency #aa9e82; fire #960000, cold #366492, lightning #ffd700, chaos #d02090 */
    :root { --ink: #c8c8c8; --gold: #aa9e82; --dim: #7f7f7f; --stone: #0c0b0a; --slab: #151311; --edge: #3b3024; --fire: #960000;
            --magic: #8888ff; --rare: #ffff77; --unique: #af6025; --gem: #1ba29b; --cold: #366492; --lightning: #ffd700; --chaos: #d02090; }
    /* the game's typeface (web/public/fonts, not in the repository: fontin-regular-webfont.woff, fontin-smallcaps-webfont.woff) */
    @font-face { font-family: "Fontin"; src: url("fonts/fontin-regular-webfont.woff") format("woff"); font-display: swap; }
    @font-face { font-family: "Fontin SmallCaps"; src: url("fonts/fontin-smallcaps-webfont.woff") format("woff"); font-display: swap; }
    html, body, #app { margin: 0; height: 100%; }
    #app > div { position: relative; min-height: 100%; }
    body { background: radial-gradient(ellipse at top, #1c1814 0%, var(--stone) 60%) fixed !important; color: var(--ink) !important;
           font: 15px/1.45 "Fontin", "Palatino Linotype", "Book Antiqua", Georgia, serif !important; }
    /* one row, 64px high, over the tree (which begins at 64px): the tabs keep their size,
       the texts beside them give way */
    #app header { box-sizing: border-box; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--edge); display: flex; align-items: center; gap: 24px;
      flex-wrap: nowrap; overflow: hidden; position: relative; z-index: 3; background: var(--stone); }
    #app header > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
    #app header > nav, #app header > h1 { flex-shrink: 0; overflow: visible; }
    @media (max-width: 760px) {
      #app header { padding: 0 10px; gap: 10px; }
      #app header > h1 { display: none; }
      #app header .title { font-size: 14px; }
      #app header .status { font-size: 12px; }
      #app .main { padding: 14px 10px; gap: 14px; }
      #app .column, #app .column.wide { flex: 1 1 100%; max-width: 100%; min-width: 0; }
      #app .main nav { flex-wrap: wrap; }
      #app header .headline { font-size: 15px; }
      #app button.tab { padding: 7px 10px; letter-spacing: 0; }
    }
    @media (max-width: 460px) {
