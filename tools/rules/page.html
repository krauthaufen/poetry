<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a08" />
<meta name="color-scheme" content="dark" />
<title>PoEtry: {{title}}</title>
<link rel="icon" href="data:," />
<!-- Written by tools/rules/guesses.py from RULES.md: do not edit. -->
<style>
  @font-face { font-family: "Fontin"; src: url("fonts/fontin-regular-webfont.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Fontin SmallCaps"; src: url("fonts/fontin-smallcaps-webfont.woff") format("woff"); font-display: swap; }
  :root { --stone: #0c0a08; --edge: #4a3a28; --edge-hi: #6b5438; --gold: #d8b878; --ink: #e6dcc8; --dim: #a8987c; --faint: #7d6f5a;
          --good: #8fbf7a; --warn: #e0a860; --bad: #e08060; --link: #e8c888; }
  * { box-sizing: border-box; }
  html { background: var(--stone); color-scheme: dark; scroll-padding-top: 12px; }
  body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at top, #1c1814 0%, var(--stone) 60%) fixed;
         font-family: "Fontin", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; font-size: 16.5px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  header.top { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px; background: linear-gradient(180deg, #1c150f, #120e0a); border-bottom: 1px solid #5a4630; }
  header.top .name { font-family: "Fontin SmallCaps", "Fontin", Georgia, serif; font-size: 24px; letter-spacing: 2px; color: var(--gold); text-decoration: none; }
  header.top nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; }
  a { color: var(--link); text-underline-offset: 3px; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 64px; }
  h1, h2, h3, h4 { font-family: "Fontin SmallCaps", "Fontin", Georgia, serif; font-weight: normal; letter-spacing: .5px; }
  h1 { font-size: 32px; color: var(--gold); margin: 32px 0 8px; }
  h2 { font-size: 23px; color: var(--gold); margin: 44px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--edge); }
  h2 i, .jump i { font-style: normal; font-family: "Fontin", serif; font-size: 13px; color: var(--faint); margin-left: 4px; }
  h4 { font-size: 16px; color: var(--faint); margin: 26px 0 8px; text-transform: uppercase; letter-spacing: 1.5px; }
  h3 { font-size: 18px; color: #f0e6d2; margin: 0 0 4px; }
  p { margin: 0 0 8px; }
  .lead { color: var(--dim); margin-bottom: 16px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.82em; color: #e8d8b8; background: #1c1610; padding: 1px 4px; border: 1px solid #33281c; overflow-wrap: anywhere; }
  .find { position: sticky; top: 0; z-index: 2; padding: 10px 0; background: linear-gradient(180deg, var(--stone) 80%, transparent); }
  .find input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #14110f; border: 1px solid var(--edge-hi); padding: 9px 12px; }
  .find input:focus { outline: 1px solid var(--gold); }
  .jump { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 4px 0 8px; font-size: 14.5px; }
  .jump a { text-decoration: none; padding: 3px 9px; border: 1px solid var(--edge); background: #17120d; white-space: nowrap; }
  .row { padding: 12px 14px; margin: 0 0 8px; border: 1px solid var(--edge); border-left-width: 3px; background: linear-gradient(180deg, #17120d, #0d0a08); overflow-wrap: anywhere; }
  .row > p { color: var(--dim); }
  .row > p:last-child { margin-bottom: 0; }
  .row .plain { color: var(--ink); }
  .row .src { font-size: 14.5px; color: var(--faint); }
  .row .src b { font-weight: normal; color: var(--dim); }
  .row.data { border-left-color: var(--good); } .row.user { border-left-color: var(--good); }
  .row.pob { border-left-color: var(--warn); }
  .row.guess, .row.missing { border-left-color: var(--bad); }
  .chip { font-family: "Fontin", serif; font-size: 12.5px; letter-spacing: 0; color: var(--dim); border: 1px solid var(--edge); padding: 1px 7px; margin-left: 6px; white-space: normal; vertical-align: 2px; }
  .row.guess .chip, .row.missing .chip { color: var(--bad); border-color: #6b3a2c; }
  .row.pob .chip { color: var(--warn); border-color: #6b5230; }
  .row.data .chip, .row.user .chip { color: var(--good); border-color: #3f5a36; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--faint); font-size: 14px; }
  details p { color: var(--faint); font-size: 14.5px; margin-top: 6px; }
  .none { display: none; color: var(--faint); padding: 24px 0; }
  footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--edge); color: var(--faint); font-size: 14px; }
  @media (max-width: 640px) { body { font-size: 16px; } h1 { font-size: 27px; margin-top: 22px; }
    header.top { gap: 10px; } header.top .name { font-size: 21px; } header.top nav { gap: 12px; font-size: 14px; } }
</style>
</head>
<body>
<header class="top">
  <a class="name" href="./">PoEtry</a>
  <nav><a href="about.html">How it works</a><a href="rules.html">Rules</a><a href="guesses.html">Guesses</a></nav>
</header>
<main>
<h1>{{title}}</h1>
<p class="lead">{{lead}}</p>
<div class="find"><input id="find" type="search" placeholder="Search: a skill, a mechanic, a word" autocomplete="off" /></div>
<div class="jump">{{nav}}</div>
{{body}}
<p class="none" id="none">Nothing matches.</p>
<footer>Written from the project's <a href="https://github.com/krauthaufen/poetry/blob/main/RULES.md">RULES.md</a>. PoEtry is a fan project and is not affiliated with or endorsed by Grinding Gear Games.</footer>
</main>
<script>
  const input = document.getElementById("find"), rows = [...document.querySelectorAll(".row")];
  const heads = [...document.querySelectorAll("main h2, main h4")];
  input.addEventListener("input", () => {
    const words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const r of rows) {
      const text = r.dataset.find + " " + r.textContent.toLowerCase();
      const hit = words.every((w) => text.includes(w));
      r.hidden = !hit; if (hit) shown++;
    }
    // a heading with nothing shown under it goes too
    for (const h of heads) {
      let n = h.nextElementSibling, any = false;
      while (n && !(n.tagName === "H2" || (h.tagName === "H4" && n.tagName === "H4"))) { if (n.classList.contains("row") && !n.hidden) { any = true; break; } n = n.nextElementSibling; }
      h.hidden = !any;
    }
    document.getElementById("none").style.display = shown ? "none" : "block";
  });
</script>
</body>
</html>
